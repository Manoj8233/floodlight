name: Check Matches

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check matches and send notifications
        run: node scripts/check-matches.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}

      - name: Commit updated match data
        run: |
          git config user.name "floodlight-bot"
          git config user.email "actions@github.com"
          git add data/state.json data/matches.json
          git diff --quiet --cached || git commit -m "Update match data [skip ci]"
          git push
